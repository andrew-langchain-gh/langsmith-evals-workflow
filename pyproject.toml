[project]
name = "deepagent-travel-planner"
version = "0.1.0"
description = "Deep Agents travel planner that delegates to flight, hotel, calendar, and activity subagents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.19",
    "langchain-anthropic>=1.7.4",
    "langsmith>=0.14.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "travel_planner"
module-root = ""
